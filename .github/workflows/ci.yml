name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]      # NFR-020
        python: ["3.11", "3.12", "3.13"]       # IV-12: versions the SDK is validated on
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from the hash-pinned lockfile
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lint
        run: ruff check hlbot tests
      - name: Type check
        run: mypy
      - name: Tests with coverage (the NFR-016 / SR-06 architecture rules run as tests)
        run: pytest --cov=hlbot --cov-report=term-missing:skip-covered
      - name: Coverage gate on risk, planning, state machine and reconciliation modules (NFR-017)
        run: coverage report --fail-under=90 --include="hlbot/domain/*,hlbot/core/engine.py,hlbot/core/reconciler.py,hlbot/core/health.py,hlbot/db/database.py"
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t hlbot:ci .
      - name: The image starts and refuses a broken configuration
        run: |
          docker run --rm hlbot:ci --version
          ! docker run --rm -e RISK_LEVERAGE=lots -e TELEGRAM_ENABLED=false hlbot:ci config
