[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hlbot"
version = "1.0.0"
description = "Telegram signal trading bot for Hyperliquid perpetuals"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "hyperliquid-python-sdk==0.24.0",
    "telethon>=1.36,<2",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
botctl = "hlbot.cli:main"

[tool.setuptools.packages.find]
include = ["hlbot*"]

[tool.setuptools.package-data]
hlbot = ["db/migrations/*.sql", "api/*.html", "api/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
# Ported from the baseline with minimal edits so the mapping stays reviewable.
"tests/unit/test_*_ported.py" = ["E741", "E402", "UP", "I001"]
"tests/**" = ["B011", "B017", "E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["hlbot"]

[tool.coverage.run]
source = ["hlbot"]
branch = false
